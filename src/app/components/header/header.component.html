<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <a href="/home"><img src="assets/logo.svg" alt="RCNG Logo" class="header-logo" /></a>
    </ion-buttons>

    <ion-buttons slot="end" class="desktop-nav">
      <ion-button (click)="goToHome()" class="nav-link">Inicio</ion-button>
      <ion-button (click)="goToJackets()" class="nav-link">Chaquetas</ion-button>
      <ion-button (click)="goToAccessories()" class="nav-link">Accesorios</ion-button>
    </ion-buttons>

    <ion-buttons slot="end" class="user-actions">
      <ion-button (click)="toggleTimeDisplay()" title="Hora local">
        <ion-icon slot="icon-only" name="time-outline"></ion-icon>
      </ion-button>
      
      <span *ngIf="showTime" class="current-time">
        <span class="country-flag">{{ countryFlag }}</span>
        {{ currentTime }}
      </span>

      <ion-button (click)="toggleTheme()">
        <ion-icon slot="icon-only" name="sunny-outline" class="theme-icon-light"></ion-icon>
        <ion-icon slot="icon-only" name="moon-outline" class="theme-icon-dark"></ion-icon>
      </ion-button>

      <ion-button (click)="goToCart()">
        <ion-icon slot="icon-only" name="cart-outline"></ion-icon>
      </ion-button>

      <ng-container *ngIf="isLoggedIn; else notLoggedIn">
        <ion-button *ngIf="isAdmin" (click)="goToAdmin()" title="Panel de administración" aria-label="Panel de administración">
          <ion-icon slot="icon-only" name="settings-outline"></ion-icon>
        </ion-button>
        <ion-button (click)="goToProfile()" title="Perfil">
          <ion-icon slot="icon-only" name="person-outline"></ion-icon>
        </ion-button>
        <ion-button (click)="logout()" color="danger" title="Cerrar sesión">
          Cerrar sesión
        </ion-button>
      </ng-container>
      <ng-template #notLoggedIn>
        <ion-button (click)="goToLogin()" title="Iniciar sesión">
          <ion-icon slot="icon-only" name="person-outline"></ion-icon>
        </ion-button>
      </ng-template>
    </ion-buttons>

    <ion-buttons slot="end" class="mobile-menu-btn">
      <ion-button (click)="toggleMobileMenu()">
        <ion-icon name="menu"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<div class="mobile-nav" [class.active]="isMobileMenuOpen">
  <ul>
    <li><a href="/home">INICIO</a></li>
    <li><a href="/jackets">CHAQUETAS</a></li>
    <li><a href="/accessories">ACCESORIOS</a></li>
  </ul>
</div>
