<app-header></app-header>

<ion-content>
  <div class="page-wrap">
    <header class="page-head">
      <h1 class="page-title">Administración</h1>
      <p class="page-lead">Gestiona las cuentas y el catálogo de la tienda.</p>
    </header>

    <div class="admin-grid">
      <a routerLink="/admin/users" class="admin-tile surface">
        <ion-icon name="people-outline" aria-hidden="true"></ion-icon>
        <h2>Usuarios</h2>
        <p>Revisa, edita o elimina cuentas de clientes.</p>
        <span class="admin-tile__cta">Ver usuarios</span>
      </a>

      <div class="admin-tile surface is-soon" *ngFor="let module of upcoming">
        <ion-icon [name]="module.icon" aria-hidden="true"></ion-icon>
        <h2>{{ module.title }}</h2>
        <p>{{ module.description }}</p>
        <span class="admin-tile__soon">Próximamente</span>
      </div>
    </div>
  </div>
</ion-content>
