<app-header></app-header>

<ion-content>
  <div class="auth">
    <app-demo-notice></app-demo-notice>
    <h1 class="page-title">Inicia sesión</h1>
    <p class="page-lead">Entra para comprar y revisar tus pedidos.</p>

    <form class="auth__form" (ngSubmit)="onLogin()">
      <ion-input
        fill="outline"
        label="Email"
        label-placement="floating"
        type="email"
        name="email"
        autocomplete="email"
        [(ngModel)]="email"
        required>
      </ion-input>

      <ion-input
        fill="outline"
        label="Contraseña"
        label-placement="floating"
        type="password"
        name="password"
        autocomplete="current-password"
        [(ngModel)]="password"
        required>
      </ion-input>

      <ion-button type="submit" expand="block" [disabled]="submitting">
        <ion-spinner *ngIf="submitting" name="crescent" slot="start"></ion-spinner>
        Iniciar sesión
      </ion-button>
    </form>

    <p class="auth__alt">¿No tienes cuenta? <a routerLink="/register">Crea una</a></p>
    <p class="auth__alt"><a routerLink="/home">Seguir como invitado</a></p>
  </div>
</ion-content>
