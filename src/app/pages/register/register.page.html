<app-header></app-header>

<ion-content>
  <div class="auth auth--wide">
    <app-demo-notice></app-demo-notice>
    <h1 class="page-title">Crea tu cuenta</h1>
    <p class="page-lead">Con tu cuenta guardas el carrito y puedes finalizar tus compras.</p>

    <form class="auth__form" (ngSubmit)="onRegister()">
      <div class="auth__grid">
        <ion-input fill="outline" label="Nombre de usuario" label-placement="floating" name="username"
          autocomplete="username" helperText="Entre 3 y 20 caracteres: letras, números o guion bajo"
          [(ngModel)]="username" required></ion-input>

        <ion-input fill="outline" label="RUT" label-placement="floating" name="rut" placeholder="12.345.678-9"
          [(ngModel)]="rut" required></ion-input>

        <ion-input class="span-2" fill="outline" label="Email" label-placement="floating" type="email" name="email"
          autocomplete="email" [(ngModel)]="email" required></ion-input>

        <ion-select fill="outline" label="Región" label-placement="floating" name="region"
          placeholder="Selecciona una región" interface="popover"
          [(ngModel)]="selectedRegion" (ionChange)="onRegionChange($event)">
          <ion-select-option *ngFor="let region of regiones" [value]="region">{{ region }}</ion-select-option>
        </ion-select>

        <ion-select fill="outline" label="Comuna" label-placement="floating" name="comuna"
          placeholder="Selecciona una comuna" interface="popover"
          [disabled]="!comunas.length" [(ngModel)]="selectedComuna">
          <ion-select-option *ngFor="let comuna of comunas" [value]="comuna">{{ comuna }}</ion-select-option>
        </ion-select>

        <ion-input fill="outline" label="Contraseña" label-placement="floating" type="password" name="password"
          autocomplete="new-password" helperText="Mínimo 8 caracteres, con letras y números"
          [(ngModel)]="password" required></ion-input>

        <ion-input fill="outline" label="Confirma la contraseña" label-placement="floating" type="password"
          name="confirmPassword" autocomplete="new-password" [(ngModel)]="confirmPassword" required></ion-input>
      </div>

      <ion-checkbox name="acceptTerms" labelPlacement="end" justify="start" [(ngModel)]="acceptTerms">
        Acepto los términos y condiciones
      </ion-checkbox>

      <ion-button type="submit" expand="block" [disabled]="submitting">
        <ion-spinner *ngIf="submitting" name="crescent" slot="start"></ion-spinner>
        Crear cuenta
      </ion-button>
    </form>

    <p class="auth__alt">¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a></p>
  </div>
</ion-content>
